    @layer base {
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow-y: auto;
      }

      .ssg-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        pointer-events: none;

        opacity: 1;
        transform: translateY(0);
        transition: background-color 0.2s ease, opacity 0.25s ease, transform 0.25s ease;
      }

      @media (prefers-color-scheme: dark) {
        .ssg-container {
          background-color: #0a0b0d;
        }
      }

      @media (prefers-color-scheme: light) {
        .ssg-container {
          background-color: #ffffff;
        }
      }

      .ssg-container.is-visible {
        opacity: 1;
      }

      .ssg-container.fade-out {
        opacity: 0;
        transform: translateY(-8px);
      }

      /* Logo opacity transitions only: start 0%, go 100% on load, back 0% on ready */
      .ssg-container .logo {
        opacity: 0;
        transition: opacity 1s ease;
      }

      @keyframes ssg-spin {
        to {

  <script>
    window.INIT_TIMESTAMP = Date.now();
    // Apply theme based on spectrum parameter (same logic as getSpectrumParams)
    function getSpectrumParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const spectrumParam = urlParams.get('spectrum');
      if (
        spectrumParam &&
        (spectrumParam === 'system' || spectrumParam === 'dark' || spectrumParam === 'light')
      ) {
        return spectrumParam;
      }
      return null;
    }

    function getSpectrumStorage() {
      const spectrum = window.localStorage.getItem('spectrum');
      if (spectrum && (spectrum === 'dark' || spectrum === 'light')) {
        return spectrum;
      }
      return null;
    }

    function getSpectrum() {
      return getSpectrumParams() || getSpectrumStorage() || 'system';
    }

    const spectrum = getSpectrum();

    let isDark = false;
    if (spectrum === 'dark') {
      isDark = true;
    } else if (spectrum === 'light') {
      isDark = false;
    } else {
      // spectrum === 'system'
      isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    // If retail_app_version param exists or action=signup, replace the logo with a spinner
    const urlParams = new URLSearchParams(window.location.search);
    // When the user is redirected to signup, we want to show the spinner to not have a second splash screen
    const userRedirectedToSignup = urlParams.get('action') === 'signup';
    const useRetailSpinner = urlParams.has('retail_app_version');
    const useSplashSpinner = userRedirectedToSignup || useRetailSpinner;

    if (useSplashSpinner) {
      const existingSvg = document.querySelector('.ssg-container svg');
      if (existingSvg && existingSvg.parentElement) {
        const ns = 'http://www.w3.org/2000/svg';
        const spinnerSvg = document.createElementNS(ns, 'svg');
        spinnerSvg.setAttribute('class', 'logo spinner spinner-blue spinner-large');
        spinnerSvg.setAttribute('width', '32');
        spinnerSvg.setAttribute('height', '32');
        spinnerSvg.setAttribute('viewBox', '0 0 24 24');
        spinnerSvg.setAttribute('role', 'img');
        spinnerSvg.setAttribute('aria-label', 'Loading');

        const titleEl = document.createElementNS(ns, 'title');
        titleEl.textContent = 'Loading';
        spinnerSvg.appendChild(titleEl);

        const trackColor = isDark ? '#1E2025' : '#EEF0F3';
        const track = document.createElementNS(ns, 'circle');
        track.setAttribute('cx', '12');
        track.setAttribute('cy', '12');
        track.setAttribute('r', '10');
        track.setAttribute('fill', 'none');
        track.setAttribute('stroke', trackColor);
        track.setAttribute('stroke-width', '3');
        spinnerSvg.appendChild(track);

        const indicatorColor = isDark ? '#3773F5' : '#0052FF';
        const indicator = document.createElementNS(ns, 'circle');
        indicator.setAttribute('cx', '12');
        indicator.setAttribute('cy', '12');
        indicator.setAttribute('r', '10');
        indicator.setAttribute('fill', 'none');
        indicator.setAttribute('stroke', indicatorColor);
        indicator.setAttribute('stroke-width', '3');
        indicator.setAttribute('stroke-dasharray', '62.8');
        indicator.setAttribute('stroke-dashoffset', '47.1');
        spinnerSvg.appendChild(indicator);

        existingSvg.replaceWith(spinnerSvg);
      }
    }

    const container = document.querySelector('.ssg-container');

    container.style.backgroundColor = isDark ? '#0a0b0d' : '#ffffff';
    const svgEl = document.querySelector('.ssg-container svg');
    if (svgEl) {
      // Set a color that spinner (stroke=currentColor) will use
      svgEl.style.color = isDark ? '#ffffff' : '#0052FF';
      // For the Coinbase logo path, explicitly set fill
      const maybePath = svgEl.querySelector('path');
      if (maybePath) {
        maybePath.style.fill = isDark ? '#ffffff' : '#0052FF';
      }
    }

    // Ensure the page background matches theme immediately to avoid white flash
    document.documentElement.style.backgroundColor = isDark ? '#0a0b0d' : '#ffffff';

    const logo = document.querySelector('.ssg-container svg');

    // If we are in the preloaded webview, don't show an SVG
    if (logo && !window.isWebViewV2) {
      requestAnimationFrame(() => {
        logo.style.opacity = '1';
      });
    }

    window.addEventListener('react-app-ready', () => {
      const splashScreen = document.getElementById('splash-screen');
      if (!splashScreen) {
        return;
      }

      window.READY_TIMESTAMP = Date.now();
      window.INIT_LOAD_TIME = window.READY_TIMESTAMP - window.INIT_TIMESTAMP;
      const runFadeOut = () => {
        // Animate the splash screen out - root is already visible beneath
        splashScreen.classList.add('fade-out');
        splashScreen.setAttribute('aria-hidden', 'true');

        // Restore page scrolling immediately
        document.documentElement.style.overflow = 'visible';
        document.body.style.overflow = 'visible';

        // After transition completes, move splash behind content instead of removing
        splashScreen.addEventListener(
          'transitionend',
          () => {
            // Move splash screen far behind all content but keep in DOM
            // This preserves LCP measurement while hiding the splash
            splashScreen.style.zIndex = '-9999';
            // Ensure no pointer events can reach the hidden splash
            splashScreen.style.pointerEvents = 'none';
          },
          { once: true },
        );
      };

      // Immediately fade out splash without waiting for logo transition
      runFadeOut();
    });
  </script>
